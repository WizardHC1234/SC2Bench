[project]
name = "sharpy-sc2"
version = "0.1.0"
description = "Sharpy SC2 framework fork with Siege Tank micro fixes"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["burnysc2==5.0.5", "numpy==1.26.4", "scipy==1.10.0", "scikit-learn==1.6.1", "sc2bench-pathlib==0.1.0", "protobuf==3.20.3", "jsonpickle==4.1.1", "s2clientprotocol==4.10.3.76114.0", "aiohttp==3.7.4", "portpicker==1.4.0", "loguru==0.7.3", "mpyq==0.2.5", "six==1.16.0"]
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["sharpy*"]

[tool.setuptools.package-data]
sharpy = ["default.ini"]
